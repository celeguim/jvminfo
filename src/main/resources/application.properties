spring.application.name=jvminfo
server.servlet.context-path=/

management.endpoints.web.exposure.include=health

# Porta do actuator
management.server.port=9090

# Habilita a exibição de detalhes do health endpoint
management.endpoint.health.show-details=always

# Habilita os endpoints de liveness e readiness
management.endpoint.health.probes.enabled=true

management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.group.readiness.include=customReadinessIndicator
management.health.group.liveness.include=customLivenessIndicator

