# Application Name
spring.application.name=jvminfo

# Web Context Path
server.servlet.context-path=/

# Spring Endpoints exposure enabled
management.endpoints.web.exposure.include=prometheus,health,info,metrics,mappings

# p95/p99 histograms
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

# Actuator port
management.server.port=9090

# Habilita a exibicao de detalhes do health endpoint
management.endpoint.health.show-details=always

# Enable endpoints for liveness and rediness
management.endpoint.health.probes.enabled=true

# Enable liveness and readiness
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Enable the app custom readiness and liveness
# The name must be different from the reserved "liveness" and "readiness"
# Otherwise it will be a collision
management.health.group.readiness.include=customReadinessIndicator
management.health.group.liveness.include=customLivenessIndicator

# Habilita as metricas detalhadas para o Prometheus
management.metrics.export.prometheus.enabled=true

# Habilita o Logger
logging.level.root=INFO
