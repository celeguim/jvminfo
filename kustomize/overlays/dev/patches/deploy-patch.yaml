apiVersion: apps/v1
kind: Deployment
metadata:
  name: jvminfo-v8-deployment
  labels:
    app: jvminfo-v8-deployment
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: jvminfo-v8
  template:
    metadata:
      labels:
        app: jvminfo-v8
    spec:
      containers:
        - image: celeguim/jvminfo:v8
          name: jvminfo-v8
          imagePullPolicy: Always
          env:
            - name: JAVA_OPTS
              value: -XX:MaxRAMPercentage=80.0 -XX:+UseContainerSupport
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 100m
              memory: 400Mi
            requests:
              cpu: 50m
              memory: 200Mi
