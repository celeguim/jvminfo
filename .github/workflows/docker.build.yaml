name: "GitHub Action to build jvminfo"

on:
  push:
    branches:
      - jvminfo-v10

jobs:
  docker_build:
    name: Docker Build
    runs-on: ubuntu-latest

    env:
      IMG_TAG: "celeguim/jvminfo:v10"

    defaults:
      run:
        shell: bash
        working-directory: .

    steps:
      - name: checkout repo
        uses: actions/checkout@v5

      - run: pwd
      - run: ls -lt
      - run: cat src/main/resources/templates/index.html

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # emulate other platforms (arm64 on an amd64 runner)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest
          
      # generates relevant tags and labels
      # - name: Extract metadata (tags, labels) for Docker
      #   id: meta
      #   uses: docker/metadata-action@v6
      #   with:
      #     images: ${{ env.IMG_TAG }}

      - name: Build and push multi-platform images
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          tags: ${{ env.IMG_TAG }}
#          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # cache-from: type=gha,scope=${{ runner.arch }}
          # cache-to: type=gha,mode=max,scope=${{ runner.arch }}
          no-cache: true
          # cache-from: type=gha,scope=${{ github.run_id }}
          # cache-to: type=gha,mode=max,scope=${{ github.run_id }}

