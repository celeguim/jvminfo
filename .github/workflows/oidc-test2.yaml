name: OIDC Test 2

on:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test GitHub TLS 1.2
        run: |
          echo | openssl s_client \
            -tls1_2 \
            -servername token.actions.githubusercontent.com \
            -connect token.actions.githubusercontent.com:443 \
            2>/dev/null \
            | openssl x509 -noout -subject -issuer

      - name: Test GitHub TLS 1.3
        run: |
          echo | openssl s_client \
            -tls1_3 \
            -servername token.actions.githubusercontent.com \
            -connect token.actions.githubusercontent.com:443 \
            2>/dev/null \
            | openssl x509 -noout -subject -issuer

      - name: Test AWS OIDC directly
        shell: bash
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          aws sts assume-role-with-web-identity \
            --role-arn "$ROLE_ARN" \
            --role-session-name "github-cosign-${GITHUB_RUN_ID}" \
            --web-identity-token "$TOKEN" \
            --endpoint-url https://sts.us-east-1.amazonaws.com
