name: Cosign Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest

    steps:
      - name: Check OIDC
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=${ACTIONS_ID_TOKEN_REQUEST_URL:+SET}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN=${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+SET}"

      - name: Validate role configuration
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          echo "Role configured: ${ROLE_ARN:+YES}"
          echo "Role: $ROLE_ARN"

      - name: Inspect GitHub TLS chain
        shell: bash
        run: |
          openssl s_client \
            -servername token.actions.githubusercontent.com \
            -connect token.actions.githubusercontent.com:443 \
            -showcerts </dev/null 2>/dev/null \
            | awk '
              /BEGIN CERTIFICATE/ { n++; out="/tmp/cert-" n ".pem" }
              out { print > out }
              /END CERTIFICATE/ { close(out); out="" }
            '

          for cert in /tmp/cert-*.pem; do
            echo "========================================"
            echo "$cert"
            openssl x509 -in "$cert" \
              -noout \
              -subject \
              -issuer \
              -fingerprint -sha1
          done

      - name: Inspect OIDC signing key
        shell: bash
        run: |
          echo $(python3 -V)

          TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          KID=$(echo "$TOKEN" \
            | cut -d '.' -f1 \
            | base64 -d 2>/dev/null \
            | jq -r '.kid')

          echo "Token kid: $KID"

          echo "GitHub JWKS:"
          curl -sSf https://token.actions.githubusercontent.com/.well-known/jwks \
            | jq --arg KID "$KID" '
                {
                  total_keys: (.keys | length),
                  matching_keys: [.keys[] | select(.kid == $KID) | {
                    kid,
                    kty,
                    alg,
                    use
                  }]
                }
              '

      - name: Inspect OIDC claims
        shell: bash
        run: |
          TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          echo "OIDC claims:"

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          # JWT usa base64url sem padding
          PAYLOAD=$(printf '%s' "$PAYLOAD" | tr '_-' '/+')
          PAYLOAD="${PAYLOAD}$(printf '%*s' $(( (4 - ${#PAYLOAD} % 4) % 4 )) '' | tr ' ' '=')"

          printf '%s' "$PAYLOAD" \
            | base64 -d \
            | jq '{
                iss,
                aud,
                sub,
                repository,
                repository_id,
                ref
              }'
                            
          echo $(python3 -V)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: github-cosign-${{ github.run_id }}
          audience: sts.amazonaws.com

      - name: Check AWS identity
        run: aws sts get-caller-identity

      - name: Sign image
        uses: celeguim/gitops/.github/actions/cosign-sign@uat
        with:
          image: ghcr.io/celeguim/jvminfo@sha256:03c03b8c4a39d036d9fa6c5d096e39488810d3cc289687a7d43d7c1a083fc1a
          key: awskms:///alias/SEU_ALIAS
