apiVersion: apps/v1
kind: Deployment
metadata:
  name: jvminfo-v10-deployment
  labels:
    app: jvminfo-v10-deployment
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: jvminfo-v10
  template:
    metadata:
      labels:
        app: jvminfo-v10
    spec:
      containers:
        - image: celeguim/jvminfo:v10
          name: jvminfo-v10
          env:
          - name: JAVA_OPTS
            value: -XX:MaxRAMPercentage=80.0 -XX:+UseContainerSupport
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 10m
              memory: 50Mi
            requests:
              cpu: 5m
              memory: 20Mi
