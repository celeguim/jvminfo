apiVersion: apps/v1
kind: Deployment
metadata:
  name: jvminfo-v9-deployment
  labels:
    app: jvminfo-v9-deployment
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: jvminfo-v9
  template:
    metadata:
      labels:
        app: jvminfo-v9
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "9090"
    spec:
      containers:
        - image: celeguim/jvminfo:v9
          name: jvminfo-v9
          imagePullPolicy: Always
          env:
            - name: JAVA_OPTS
              value: -XX:MaxRAMPercentage=80.0 -XX:+UseContainerSupport
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 200m
              memory: 800Mi
            requests:
              cpu: 100m
              memory: 500Mi
