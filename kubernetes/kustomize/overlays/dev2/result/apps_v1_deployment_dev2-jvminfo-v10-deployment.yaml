apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: jvminfo-v10-deployment
    environment: dev2
  name: dev2-jvminfo-v10-deployment
  namespace: dev2
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: jvminfo-v10
  template:
    metadata:
      annotations:
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "9090"
        prometheus.io/scrape: "true"
      labels:
        app: jvminfo-v10
    spec:
      containers:
      - env:
        - name: JAVA_OPTS
          value: -XX:MaxRAMPercentage=80.0 -XX:+UseContainerSupport
        image: celeguim/jvminfo:v10
        imagePullPolicy: Always
        name: jvminfo-v10
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 200m
            memory: 900Mi
          requests:
            cpu: 100m
            memory: 700Mi
