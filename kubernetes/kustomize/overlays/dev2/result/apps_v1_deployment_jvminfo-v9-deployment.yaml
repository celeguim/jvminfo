apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: jvminfo-v9-deployment
  name: jvminfo-v9-deployment
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: jvminfo-v9
  template:
    metadata:
      annotations:
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "9090"
        prometheus.io/scrape: "true"
      labels:
        app: jvminfo-v9
    spec:
      containers:
      - env:
        - name: JAVA_OPTS
          value: -XX:MaxRAMPercentage=80.0 -XX:+UseContainerSupport
        image: celeguim/jvminfo:v9
        imagePullPolicy: Always
        name: jvminfo-v9
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 100m
            memory: 400Mi
          requests:
            cpu: 50m
            memory: 200Mi
