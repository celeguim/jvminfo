apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  labels:
    environment: dev4
  name: dev4-jvminfo-v9-hpa
  namespace: dev4
spec:
  maxReplicas: 3
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 4
        type: Utilization
    type: Resource
  - resource:
      name: memory
      target:
        averageUtilization: 20
        type: Utilization
    type: Resource
  minReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dev4-jvminfo-v9-deployment
