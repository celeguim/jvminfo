apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  labels:
    environment: dev3
  name: dev3-jvminfo-v9-hpa
  namespace: dev3
spec:
  maxReplicas: 3
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 60
        type: Utilization
    type: Resource
  - resource:
      name: memory
      target:
        averageUtilization: 80
        type: Utilization
    type: Resource
  minReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dev3-jvminfo-v9-deployment
