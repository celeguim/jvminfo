apiVersion: apps/v1
kind: Deployment
metadata:
  name: jvminfo-v10-deployment
  labels:
    app: jvminfo-v10-deployment
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: jvminfo-v10
  template:
    metadata:
      labels:
        app: jvminfo-v10
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "9090"
    spec:
      containers:
        - image: celeguim/jvminfo:v10
          name: jvminfo-v10
          imagePullPolicy: Always
          env:
            - name: JAVA_OPTS
              value: -XX:MaxRAMPercentage=80.0 -XX:+UseContainerSupport
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 200m
              memory: 900Mi
            requests:
              cpu: 100m
              memory: 700Mi
    
          # STARTUP: Dá até 3 minutos para o app subir, conectar no MySQL e criar as tabelas
          # startupProbe:
          #   httpGet:
          #     path: /actuator/health/liveness
          #     port: 9090
          #   failureThreshold: 18
          #   periodSeconds: 10

          # LIVENESS: Se falhar 3 vezes seguidas (30s), o K8s reinicia o Pod (morte cerebral)
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # READINESS: Se o MySQL ou Rabbit caírem por 30s, o Pod para de receber tráfego HTTP
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
