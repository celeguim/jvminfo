apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  labels:
    environment: dev1
  name: dev1-jvminfo-v10-hpa
  namespace: dev1
spec:
  maxReplicas: 3
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 10
        type: Utilization
    type: Resource
  - resource:
      name: memory
      target:
        averageUtilization: 80
        type: Utilization
    type: Resource
  minReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dev1-jvminfo-v10-deployment
