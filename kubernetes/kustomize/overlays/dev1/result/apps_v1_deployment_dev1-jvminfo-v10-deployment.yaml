apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: jvminfo-v10-deployment
    environment: dev1
  name: dev1-jvminfo-v10-deployment
  namespace: dev1
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: jvminfo-v10
  template:
    metadata:
      annotations:
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "9090"
        prometheus.io/scrape: "true"
      labels:
        app: jvminfo-v10
    spec:
      containers:
      - env:
        - name: JAVA_OPTS
          value: -XX:MaxRAMPercentage=80.0 -XX:+UseContainerSupport
        image: celeguim/jvminfo:v10
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health/liveness
            port: 9090
          periodSeconds: 10
          timeoutSeconds: 3
        name: jvminfo-v10
        ports:
        - containerPort: 8080
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health/readiness
            port: 9090
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 900Mi
          requests:
            cpu: 100m
            memory: 700Mi
