apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-network-policy-v2
  annotations:
    policies.kyverno.io/title: Require NetworkPolicy
    policies.kyverno.io/category: Digio/EKS/Security
    policies.kyverno.io/description: >
      NetworkPolicy is used to control Pod-to-Pod communication 
      and is a good practice to ensure only authorized Pods can 
      send/receive traffic. This policy checks incoming Deployments 
      to ensure they have a matching, preexisting NetworkPolicy.

spec:
  validationFailureAction: Audit
  background: false

  rules:
    - name: require-network-policy
      match:
        any:
          - resources:
              kinds:
                - Deployment

      preconditions:
        any:
          - key: "{{ request.operation || 'BACKGROUND' }}"
            operator: Equals
            value: CREATE

      context:
        - name: policies_count
          apiCall:
            urlPath: >-
              /apis/networking.k8s.io/v1/namespaces/{{request.namespace}}/networkpolicies
            jmesPath: >-
              items[?label_match(
              spec.podSelector.matchLabels,
              `{{request.object.spec.template.metadata.labels}}`
              )] | length(@)

      validate:
        message: >-
          Every Deployment requires a matching NetworkPolicy.

        deny:
          conditions:
            any:
              - key: "{{ policies_count }}"
                operator: LessThan
                value: 1
